spring.application.name=cricbuzz
# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5434/db2rest_demo
spring.datasource.username=db2rest_user
spring.datasource.password=dev_db2rest_pw
spring.datasource.driver-class-name=org.postgresql.Driver

# Cricbuzz schema
spring.jpa.properties.hibernate.default_schema=cricbuzz

# Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Application
server.port=8081